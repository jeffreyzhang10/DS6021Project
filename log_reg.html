<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Receiver Target Prediction</title>

  <style>
  /* ---- Global reset inside iframe ---- */
  body {
    font-family: Arial, sans-serif;
    margin: 18px;
    background: #ffffff !important;
    color: #111 !important;
  }

  h1, .note {
    color: #111 !important;
  }

  button {
    padding: 6px 10px;
    cursor: pointer;
    background: #f5f5f5;
    color: #111;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  /* ---- Layout ---- */
  details {
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
    background: #ffffff;
  }

  summary {
    font-weight: 700;
    cursor: pointer;
    color: #111;
  }

  .grid {
    display: grid;
    grid-template-columns: 520px 1fr;
    gap: 14px;
    margin-top: 10px;
  }

  /* ---- SVG ---- */
  svg {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 10px;
  }

  .def { fill:#d62728; opacity:0.85; }

  .qb { fill: #111; }
  .off { fill: #1f77b4; }
  .pred {
    stroke: #ff7f0e;
    stroke-width: 3;
  }

  text {
    fill: #111 !important;
    font-size: 12px;
    font-weight: 600;
  }

  /* ---- TABLE (THIS IS THE IMPORTANT PART) ---- */
  table {
    border-collapse: collapse;
    width: 100%;
    background: #ffffff !important;
    color: #111 !important;
  }

  th {
    background: #f0f0f0 !important;
    color: #111 !important;
    font-weight: 700;
    padding: 8px;
    border: 1px solid #ccc;
    text-align: left;
  }

  td {
    background: #ffffff !important;
    color: #111 !important;
    padding: 8px;
    border: 1px solid #ddd;
    font-weight: 500;
  }

  /* Highlight predicted row */
  tr.predRow td {
    background: #fff3e0 !important;
    color: #111 !important;
    font-weight: 700;
  }
</style>

</head>

<body>
<h1>Receiver Target Prediction</h1>

<div class="note">
  Logistic score using:
  <code>dist_to_qb</code>,
  <code>nearest_defender_dist</code>,
  <code>vel_toward_qb</code>,
  <code>position</code>.
  <br>
  Probabilities are <b>relative rankings</b> (no intercept).
</div>

<!-- Streamlit will inject the computed play JSON here -->
<script>
  // Streamlit will replace __PLAY_DATA_JSON__ with real JSON
  window.PLAY_DATA = JSON.parse("__PLAY_DATA_JSON__");
</script>


<!-- Button is kept for UI consistency, but no longer fetches from a server -->
<button id="load" type="button">Load random play</button>

<div id="plays"></div>

<script>
function esc(s){ return (s ?? "").toString()
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");
}

function svgForPlay(offRows, defRows){
  const qb = offRows[0];
  if (qb.qb_x == null || qb.qb_y == null) {
    return `<div class="note">QB position missing for this play.</div>`;
  }

  const all = [...offRows, ...(defRows || [])];

  const rx = all.map(r => r.x_mid - r.qb_x);
  const ry = all.map(r => r.y_mid - r.qb_y);

  const xmin = Math.min(0, ...rx) - 3;
  const xmax = Math.max(0, ...rx) + 3;
  const ymin = Math.min(0, ...ry) - 3;
  const ymax = Math.max(0, ...ry) + 3;

  const W=520, H=280;
  const mapx = x => (x - xmin)/(xmax-xmin)*W;
  const mapy = y => (1-(y-ymin)/(ymax-ymin))*H;

  let s = `<circle class="qb" cx="${mapx(0)}" cy="${mapy(0)}" r="6"></circle>
           <text x="${mapx(0)+8}" y="${mapy(0)-8}">QB</text>`;

  // defenders (squares)
  (defRows || []).forEach(d => {
    const x = mapx(d.x_mid - d.qb_x);
    const y = mapy(d.y_mid - d.qb_y);
    s += `<rect class="def" x="${x-4}" y="${y-4}" width="8" height="8"></rect>`;
  });

  // offense (circles)
  const predId = offRows[0].nfl_id;
  offRows.forEach(r=>{
    const cls = (r.nfl_id === predId) ? "off pred" : "off";
    const x = mapx(r.x_mid - r.qb_x);
    const y = mapy(r.y_mid - r.qb_y);
    const last = esc(r.player_name.split(" ").slice(-1)[0]);
    s += `<circle class="${cls}" cx="${x}" cy="${y}" r="5"></circle>`;
    s += `<text x="${x+7}" y="${y-7}">${last}</text>`;
  });

  return `<svg width="${W}" height="${H}">${s}</svg>`;
}


function tableForPlay(rows){
  let trs = "";
  rows.forEach((r,i)=>{
    trs += `<tr class="${i===0?'predRow':''}">
      <td>${i+1}</td>
      <td>${esc(r.player_name)}</td>
      <td>${esc(r.position)}</td>
      <td>${Number(r.p_target).toFixed(3)}</td>
      <td>${Number(r.dist_to_qb).toFixed(2)}</td>
      <td>${(r.nearest_defender_dist == null || isNaN(r.nearest_defender_dist)) ? "" : Number(r.nearest_defender_dist).toFixed(2)}</td>
      <td>${r.vel_toward_qb}</td>
    </tr>`;
  });
  return `
    <table>
      <thead>
        <tr>
          <th>Rank</th><th>Player</th><th>Pos</th>
          <th>Score</th><th>dist→QB</th>
          <th>nearest def</th><th>vel→QB</th>
        </tr>
      </thead>
      <tbody>${trs}</tbody>
    </table>`;
}

function renderFromInjectedData(){
  const data = window.PLAY_DATA || {};
  const offRows = data.rows || [];
  const defRows = data.defenders || [];

  const container = document.getElementById("plays");
  container.innerHTML = "";

  if (!offRows.length) {
    container.innerHTML = `<div class="note">No eligible offensive players for this play.</div>`;
    return;
  }

  const header = `Game ${data.game_id} — Play ${data.play_id}
    | Pred: ${esc(data.pred_player_name)} (${esc(data.pred_position)})`;

  container.innerHTML = `
    <details open>
      <summary>${header}</summary>
      <div class="grid">
        <div>${svgForPlay(offRows, defRows)}</div>
        <div>${tableForPlay(offRows)}</div>
      </div>
    </details>`;
}


// In Streamlit, new play data arrives when the iframe is re-rendered.
// The button remains, but it just re-renders current injected data.
document.getElementById("load").addEventListener("click", renderFromInjectedData);

// initial render
renderFromInjectedData();
</script>
</body>
</html>
